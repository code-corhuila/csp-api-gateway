name: CI

# Every Pull Request builds the repository and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t gateway .
      - name: Throwaway CA for the Catalog TLS hop
        run: sh tests/support/make-ca.sh "$RUNNER_TEMP/tls"
      - name: The configuration is valid
        run: |
          docker create --name config gateway nginx -t
          docker cp "$RUNNER_TEMP/tls/ca.crt" config:/run/tls/ca.crt
          docker start -a config
      - name: Smoke checks
        run: |
          docker create --name gateway -p 8000:8000 gateway
          docker cp "$RUNNER_TEMP/tls/ca.crt" gateway:/run/tls/ca.crt
          docker start gateway
          sleep 2
          sh tests/smoke.sh http://localhost:8000
      - name: Integration checks
        run: sh tests/integration.sh
