# Booking domain: csp-booking-api (contract: csp-docs/07-api/contracts/openapi/booking-service.yaml 3.3.0).
# Only the client operations of the contract are routed, each with the method it declares; any other path
# or method under /api/v1/booking/ falls to the gateway's 404.

# Service-to-service operations (csp-worker and csp-workflow call them directly): never exposed.
location ^~ /api/v1/booking/internal {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
}

# Public operations (security: [] in the contract): no Authorization required.
location ~ ^/api/v1/booking/(health|health/ready)$ {
    include /etc/nginx/snippets/route-common.conf;
    proxy_pass $booking_upstream;
}

# Protected operations (bearerAuth): the presence of Authorization is checked here, the token by the service.
location = /api/v1/booking/holds {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != POST) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $booking_upstream;
}

location = /api/v1/booking/reservations {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $booking_upstream;
}

location ~ ^/api/v1/booking/(reservations/[^/]+|showtimes/[^/]+/seats)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $booking_upstream;
}

location ~ ^/api/v1/booking/reservations/[^/]+/confirm$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != POST) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $booking_upstream;
}
