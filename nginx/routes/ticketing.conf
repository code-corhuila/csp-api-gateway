# Ticketing: csp-ticketing-api (contract: csp-docs/07-api/contracts/openapi/ticketing-fulfillment-service.yaml 1.3.0).
# Only the operations of the contract that a client calls are routed, each with the method it declares; any other
# path or method under /api/v1/ticketing/ falls to the gateway's 404. The presence of Authorization is checked
# here, the token and the permission ticket:read:self by the service.

# Service-to-service operations (csp-worker calls them directly): never exposed.
location ^~ /api/v1/ticketing/internal {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
}

# Public operations (security: [] in the contract): no Authorization required.
location ~ ^/api/v1/ticketing/(health|health/ready)$ {
    include /etc/nginx/snippets/route-common.conf;
    proxy_pass $ticketing_upstream;
}

# The tickets of the user and the download of the PDF of one of them.
location ~ ^/api/v1/ticketing/me/tickets(/[^/]+/pdf)?$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $ticketing_upstream;
}
