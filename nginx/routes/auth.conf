# Auth domain: csp-auth-api (contract: csp-docs/07-api/contracts/openapi/auth-service.yaml).
# Only the operations of the contract are routed; any other path under /api/v1/auth/ falls
# to the gateway's 404.

# Service-to-service operations (csp-worker calls them directly): never exposed.
location ^~ /api/v1/auth/internal {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
}

# Public operations (security: [] in the contract): no Authorization required.
location ~ ^/api/v1/auth/(register|login|refresh|forgot-password|reset-password|jwks|health|health/ready)$ {
    include /etc/nginx/snippets/route-common.conf;
    proxy_pass $auth_upstream;
}

# Protected operations (bearerAuth): logout, /me (own profile), /me/*, /users, /users/{userId}/role.
location ~ ^/api/v1/auth/(logout|users|me(/.+)?|users/[^/]+/role)$ {
    include /etc/nginx/snippets/route-common.conf;
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $auth_upstream;
}
