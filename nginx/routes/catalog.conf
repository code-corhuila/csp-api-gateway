# Catalog domain: csp-catalog-api (contract: csp-docs/07-api/contracts/openapi/catalog-service.yaml).
# Only the two public reads of the contract (security: [] in getBillboard and searchMovies) are
# routed, and only for GET; any other path or method under /api/v1/catalog/ falls to the gateway's 404.
# The administration routes (/movies, /rooms, /showtimes) and the availability of a showtime, which
# is service-to-service (Booking calls the service directly), are not exposed here.

# Public reads: no Authorization required, and a token that is sent is ignored by the service.
location ~ ^/api/v1/catalog/(billboard|billboard/movies)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    proxy_pass $catalog_upstream;
}
