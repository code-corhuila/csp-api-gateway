# Catalog domain: csp-catalog-api (contract: csp-docs/07-api/contracts/openapi/catalog-service.yaml).
# Only the operations of the contract that a client uses are routed, each with the method it declares;
# any other path or method under /api/v1/catalog/ falls to the gateway's 404. The availability of a
# showtime is service-to-service (Booking calls the service directly) and is not exposed here.

# Public reads: no Authorization required, and a token that is sent is ignored by the service.
location ~ ^/api/v1/catalog/(billboard|billboard/movies)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    proxy_pass $catalog_upstream;
}

# Administration (bearerAuth, catalog:write, room:write and showtime:write in the contract): the presence
# of Authorization is checked here, the token and the permission by the service. The collections accept
# GET and POST; an item accepts GET, PATCH and DELETE (archive or cancel).
location ~ ^/api/v1/catalog/(movies|rooms|showtimes)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method !~ ^(GET|POST)$) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $catalog_upstream;
}

location ~ ^/api/v1/catalog/(movies|rooms|showtimes)/[^/]+$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method !~ ^(GET|PATCH|DELETE)$) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $catalog_upstream;
}
