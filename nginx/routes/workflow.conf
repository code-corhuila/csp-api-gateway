# Workflow: csp-workflow (contract: csp-docs/07-api/contracts/openapi/workflow-service.yaml, ADR-066).
# Only the two operations of the contract are routed, each with the method it declares; any other path or method
# under /api/v1/sagas, and the liveness probe of the workflow, fall to the gateway's 404. The presence of
# Authorization is checked here; the token of the user is validated by the service itself.

# Starts the saga that holds seats and confirms the reservation.
location = /api/v1/sagas/book-seats {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != POST) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $workflow_upstream;
}

# Reads a saga by its id.
location ~ ^/api/v1/sagas/[^/]+$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $workflow_upstream;
}
