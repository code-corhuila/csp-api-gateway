# Concessions domain: csp-concessions-api (contract: csp-docs/07-api/contracts/openapi/concessions-service.yaml).
# Only the client operations of the contract are routed, each with the method it declares; any other path
# or method under /api/v1/concessions/ falls to the gateway's 404. The presence of Authorization is checked
# here, the token and the permission by the service.

# Service-to-service operations (csp-worker calls them directly): never exposed.
location ^~ /api/v1/concessions/internal {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
}

# Public operations (security: [] in the contract): no Authorization required.
location ~ ^/api/v1/concessions/(health|health/ready)$ {
    include /etc/nginx/snippets/route-common.conf;
    proxy_pass $concessions_upstream;
}

# Products, combos and orders: the collections accept GET and POST.
location ~ ^/api/v1/concessions/(products|combos|orders)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method !~ ^(GET|POST)$) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $concessions_upstream;
}

# The status of a product or a combo changes with PATCH.
location ~ ^/api/v1/concessions/(products|combos)/[^/]+$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != PATCH) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $concessions_upstream;
}

location ~ ^/api/v1/concessions/(orders/[^/]+|stock/movements)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != GET) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $concessions_upstream;
}

location ~ ^/api/v1/concessions/(orders/[^/]+/cancel|stock/adjust)$ {
    default_type application/json;
    include /etc/nginx/snippets/route-common.conf;
    if ($request_method != POST) {
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }
    include /etc/nginx/snippets/require-auth.conf;
    proxy_pass $concessions_upstream;
}
