worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Structured access log: one JSON object per request, with a correlation id.
    log_format json escape=json '{"time":"$time_iso8601","correlationId":"$correlation_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","durationMs":$request_time}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/conf.d/*.conf;
}
