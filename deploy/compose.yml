name: csp-api-gateway

services:
  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_GATEWAY_CORS_ORIGIN_REGEX: ${APP_GATEWAY_CORS_ORIGIN_REGEX:-http://localhost:(4200|4201|4202|4203|4204|4205)}
      APP_GATEWAY_AUTH_UPSTREAM: ${APP_GATEWAY_AUTH_UPSTREAM:-http://auth-api:8081}
      APP_GATEWAY_CATALOG_UPSTREAM: ${APP_GATEWAY_CATALOG_UPSTREAM:-http://catalog-api:8082}
      APP_GATEWAY_BOOKING_UPSTREAM: ${APP_GATEWAY_BOOKING_UPSTREAM:-http://booking-api:8083}
    # The only service that publishes a port to the host.
    ports: ["8000:8000"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
