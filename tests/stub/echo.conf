# Upstream stand-in for the integration checks (it is not part of the gateway image).
# Port 80 answers 200 and echoes, as JSON, the request headers the gateway forwarded, and sets
# its own X-Correlation-Id like a real service. Port 81 closes the connection without answering,
# which the gateway sees as a failed upstream (502).
events {}
http {
    server {
        listen 80;
        location / {
            default_type application/json;
            add_header X-Correlation-Id $http_x_correlation_id always;
            return 200 '{"xUserId":"$http_x_user_id","xUserRoles":"$http_x_user_roles","authorization":"$http_authorization","correlationId":"$http_x_correlation_id"}';
        }
    }
    server {
        listen 81;
        return 444;
    }
}
