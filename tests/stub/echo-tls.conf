# HTTPS upstream stand-in for the Catalog checks (not part of the gateway image). The certificates are
# mounted at /run/tls by the test (tests/support/make-ca.sh). Same answers as echo.conf:
# 8082 answers 200 and echoes the forwarded headers, 8083 closes the connection without answering,
# 8084 serves a certificate for another name, 8085 serves a certificate of an untrusted CA.
events {}
http {
    map "" $echo_body {
        default '{"xUserId":"$http_x_user_id","xUserRoles":"$http_x_user_roles","authorization":"$http_authorization","correlationId":"$http_x_correlation_id"}';
    }
    server {
        listen 8082 ssl;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        location / {
            default_type application/json;
            add_header X-Correlation-Id $http_x_correlation_id always;
            return 200 $echo_body;
        }
    }
    server {
        listen 8083 ssl;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        return 444;
    }
    server {
        listen 8084 ssl;
        ssl_certificate /run/tls/wrong-name.crt;
        ssl_certificate_key /run/tls/wrong-name.key;
        return 200 '{"reached":"wrong-name"}';
    }
    server {
        listen 8085 ssl;
        ssl_certificate /run/tls/untrusted.crt;
        ssl_certificate_key /run/tls/untrusted.key;
        return 200 '{"reached":"untrusted"}';
    }
}
